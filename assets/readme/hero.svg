<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">OpenWorker · 开源桌面 AI 协作伙伴（中文增强版 fork）</title>
  <desc id="hero-desc">分层架构图：OpenWorker 桌面应用包裹本地 agent 服务，运行在你自己的文件、工具与模型之上。</desc>

  <defs>
    <linearGradient id="stackfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" rx="20" fill="#0b0d10"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#1f242b" stroke-width="1"/>

  <!-- ===== left: title block ===== -->
  <g transform="translate(56 60)">
    <!-- category eyebrow -->
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7dd3fc" letter-spacing="2">
      OPEN-SOURCE · DESKTOP · AI COWORKER · 中文增强版
    </text>

    <!-- name -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="58" font-weight="700" fill="#eef1f4">
      OpenWorker
    </text>

    <!-- one-line value -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#c7cdd4">
      交付完成的工作，而不只是聊天
    </text>

    <!-- supporting line -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#9aa3ad">
      <text x="0" y="148">运行在你自己的机器上 · 自带模型 Key · 本地优先</text>
      <text x="0" y="176">一份文档 · 一条带数据的 Slack 回复</text>
      <text x="0" y="200">一个更新好的日程 · 一个分拣后的收件箱</text>
    </g>

    <!-- fork metadata -->
    <g transform="translate(0 226)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6b7480">
      <text x="0" y="0">fork · kael-odin/openworker · 追平 upstream ·  MIT</text>
    </g>
  </g>

  <!-- ===== right: native architecture diagram ===== -->
  <g transform="translate(700 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- tier 1: desktop app -->
    <rect x="0" y="0" width="440" height="74" rx="14" fill="#14181d" stroke="#262c34" stroke-width="1"/>
    <text x="20" y="30" font-size="15" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DESKTOP APP</text>
    <text x="20" y="54" font-size="16" fill="#c7cdd4">原生外壳 + GUI · 监督本地服务</text>

    <!-- tier 2: local agent server -->
    <rect x="0" y="92" width="440" height="74" rx="14" fill="#14181d" stroke="#262c34" stroke-width="1"/>
    <rect x="0" y="92" width="440" height="74" rx="14" fill="url(#stackfade)"/>
    <text x="20" y="122" font-size="15" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOCAL AGENT SERVER · Python</text>
    <text x="20" y="146" font-size="16" fill="#c7cdd4">引擎 · 工具 · 连接器 · 基于 aisuite</text>

    <!-- connector brackets: files / tools / model -->
    <path d="M40 184 L40 212 M200 184 L200 212 M360 184 L360 212" stroke="#3a4148" stroke-width="1.5" fill="none"/>
    <path d="M40 212 L360 212" stroke="#3a4148" stroke-width="1.5" fill="none"/>

    <!-- tier 3: three resource cards -->
    <g>
      <rect x="0" y="220" width="120" height="62" rx="12" fill="#14181d" stroke="#262c34" stroke-width="1"/>
      <text x="60" y="246" font-size="15" text-anchor="middle" fill="#e6e8eb" font-weight="600">文件</text>
      <text x="60" y="268" font-size="13" text-anchor="middle" fill="#9aa3ad">与终端</text>
    </g>
    <g>
      <rect x="140" y="220" width="160" height="62" rx="12" fill="#14181d" stroke="#262c34" stroke-width="1"/>
      <text x="220" y="246" font-size="15" text-anchor="middle" fill="#e6e8eb" font-weight="600">25+ 连接器</text>
      <text x="220" y="268" font-size="13" text-anchor="middle" fill="#9aa3ad">GitHub · Slack · Jira</text>
    </g>
    <g>
      <rect x="320" y="220" width="120" height="62" rx="12" fill="#14181d" stroke="#262c34" stroke-width="1"/>
      <text x="380" y="246" font-size="15" text-anchor="middle" fill="#e6e8eb" font-weight="600">任意模型</text>
      <text x="380" y="268" font-size="13" text-anchor="middle" fill="#9aa3ad">自带 Key</text>
    </g>

    <!-- caption under stack -->
    <text x="220" y="306" font-size="14" text-anchor="middle" fill="#6b7480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      全部用你的 Key · 在你的机器上运行
    </text>
  </g>
</svg>
